<!DOCTYPE html>
<html>
<head>
    <title>Library</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Library Membership Form</h1>

    <hr>

    <h2>Fill up your Informations</h2>

    <form id="libraryForm">

        <div>
			<label for="name">Name:</label>
			<input type="text" id="name" required>
        </div><br><br>

        <div>
			<label for="age">Age:</label>
			<input type="number" id="age" required>
        </div><br><br>
		<div>
			<label for="email">Email:</label>
			<input type="email" id="email" required>
        </div><br><br>

        <div>
			<label for="contact">Contact Number:</label>
			<input type="text" id="contact" required>
        </div><br><br>
		
		<div>
			<label>Choose your membership:</label>
				<input type="radio" name="membership" value="Basic" required>Basic
				<input type="radio" name="membership" value="Silver">Silver
				<input type="radio" name="membership" value="Gold">Gold
		</div><br><br>
		
		<div>
			<input type="submit" value="Register">
			<input type="reset" value="Clear">
		</div><br>

    </form>
	<hr>
    <h2>Membership Informations</h2>
    <div id="output"></div>
	<script src="script.js"></script>

</body>
</html>
